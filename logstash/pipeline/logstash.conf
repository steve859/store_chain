# Logstash pipeline for Store Chain logs
# Receives JSON logs and forwards to Elasticsearch

input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Parse timestamp
  date {
    match => ["time", "ISO8601"]
    target => "@timestamp"
  }

  # Add trace correlation fields for linking with Jaeger
  if [traceId] {
    mutate {
      add_field => { "trace.id" => "%{traceId}" }
    }
  }
  if [spanId] {
    mutate {
      add_field => { "span.id" => "%{spanId}" }
    }
  }

  # Classify log levels
  if [level] == "error" or [level] == "fatal" {
    mutate {
      add_tag => ["error"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "store-chain-logs-%{+YYYY.MM.dd}"
  }
}
