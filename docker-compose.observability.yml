# ASR-M3: Observability Stack
# Jaeger (Distributed Tracing) + ELK (Centralized Logging)
#
# Usage:
#   docker compose -f docker-compose.observability.yml up -d
#
# Endpoints:
#   Jaeger UI:          http://localhost:16686
#   Kibana:             http://localhost:5601
#   Elasticsearch:      http://localhost:9200
#   OTLP HTTP Receiver: http://localhost:4318

services:
  # ─────────────────────────────────────────────────
  # Jaeger – All-in-one (receives OTLP, stores & serves UI)
  # ─────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: store-chain-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP  ← tracing.ts points here
      - "14268:14268"   # Jaeger HTTP Thrift
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    volumes:
      - jaeger_data:/badger

  # ─────────────────────────────────────────────────
  # Elasticsearch – Log storage
  # ─────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: store-chain-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'status']
      interval: 30s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────────────
  # Kibana – Log visualization & dashboards
  # ─────────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: store-chain-kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ─────────────────────────────────────────────────
  # Logstash – (Optional) Log pipeline / enrichment
  # If using pino-elasticsearch directly, Logstash is optional.
  # Included here for completeness & future enrichment.
  # ─────────────────────────────────────────────────
  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: store-chain-logstash
    restart: unless-stopped
    ports:
      - "5044:5044"
      - "5000:5000/tcp"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  jaeger_data:
  es_data:
